<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#111111">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Pinnwand">
	<title>Pinnwand</title>
	<style>
		:root {
			--bg: #111;
			--karte: #1c1c1e;
			--linie: #2c2c2e;
			--text: #f2f2f2;
			--leise: #8e8e93;
			--akzent: #64b5f6;
			--gefahr: #ef5350;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			padding: max(16px, env(safe-area-inset-top)) 16px 40px;
			background: var(--bg);
			color: var(--text);
			font: 17px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
		}
		h1 { font-size: 28px; margin: 8px 0 20px; font-weight: 600; }
		h2 {
			font-size: 13px; margin: 28px 0 8px; color: var(--leise);
			text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500;
		}
		.karte { background: var(--karte); border-radius: 12px; overflow: hidden; }
		form { display: flex; gap: 8px; }
		input, textarea, select, button { font: inherit; color: inherit; }
		input[type=text], input[type=password], textarea, select {
			width: 100%; padding: 12px; border: 1px solid var(--linie);
			border-radius: 10px; background: var(--karte);
		}
		textarea { resize: vertical; min-height: 70px; }
		button {
			padding: 12px 16px; border: none; border-radius: 10px;
			background: var(--akzent); color: #000; font-weight: 600; white-space: nowrap;
		}
		button.leise { background: var(--linie); color: var(--text); }
		ul { list-style: none; margin: 0; padding: 0; }
		li {
			display: flex; align-items: center; gap: 12px;
			padding: 12px 14px; border-bottom: 1px solid var(--linie);
		}
		li:last-child { border-bottom: none; }
		li .text { flex: 1; overflow-wrap: anywhere; }
		li .von { color: var(--leise); font-size: 13px; }
		li.erledigt .text { color: var(--leise); text-decoration: line-through; }
		.haken {
			width: 26px; height: 26px; flex: none; border-radius: 50%;
			border: 2px solid var(--leise); background: none; padding: 0;
		}
		li.erledigt .haken { background: var(--akzent); border-color: var(--akzent); }
		.weg { background: none; color: var(--leise); padding: 4px 8px; font-size: 20px; }
		.leer { padding: 14px; color: var(--leise); }
		.reihe { display: flex; gap: 8px; margin-top: 8px; }
		.aktuell { padding: 14px; }
		.aktuell .text { font-size: 20px; }
		.aktuell .info { color: var(--leise); font-size: 13px; margin-top: 4px; }
		#meldung {
			position: fixed; left: 16px; right: 16px; bottom: 20px; padding: 12px 14px;
			border-radius: 10px; background: var(--gefahr); color: #fff; display: none;
		}
		.fuss { margin-top: 32px; color: var(--leise); font-size: 13px; }
		.fuss a { color: var(--leise); }
	</style>
</head>
<body>
	<h1>Pinnwand</h1>

	<h2>Neues To-do</h2>
	<form id="todoForm">
		<input id="todoText" type="text" maxlength="120" placeholder="z. B. Milch kaufen" autocomplete="off">
		<button type="submit">+</button>
	</form>

	<h2>Zu erledigen</h2>
	<div class="karte"><ul id="offen"></ul></div>

	<h2>Nachricht auf dem Spiegel</h2>
	<div class="karte" id="aktuell" hidden></div>
	<form id="nachrichtForm" style="display:block; margin-top:8px">
		<textarea id="nachrichtText" maxlength="200" placeholder="z. B. Bin um 18 Uhr zurück"></textarea>
		<div class="reihe">
			<select id="dauer">
				<option value="2">2 Stunden</option>
				<option value="heute" selected>bis heute Abend</option>
				<option value="24">1 Tag</option>
				<option value="72">3 Tage</option>
			</select>
			<button type="submit">Zeigen</button>
		</div>
	</form>

	<h2>Erledigt</h2>
	<div class="karte"><ul id="erledigt"></ul></div>

	<p class="fuss">
		Name: <span id="name"></span> · <a href="#" id="nameAendern">ändern</a> ·
		<a href="#" id="pinVergessen">PIN neu eingeben</a>
	</p>
	<div id="meldung"></div>

	<script>
		const speicher = {
			get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
			set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* ohne Speicher weiter */ } }
		};
		let daten = { todos: [], nachricht: null, pinNoetig: false };

		function meldung (text) {
			const el = document.getElementById("meldung");
			el.textContent = text;
			el.style.display = "block";
			clearTimeout(meldung.t);
			meldung.t = setTimeout(() => (el.style.display = "none"), 3500);
		}

		function name () {
			let n = speicher.get("pw-name");
			if (!n) {
				n = (prompt("Wie heisst du? (erscheint beim Eintrag)") || "").trim().slice(0, 20);
				speicher.set("pw-name", n);
			}
			document.getElementById("name").textContent = n || "–";
			return n;
		}

		async function api (methode, pfad, body, nochmal = true) {
			const res = await fetch(`api${pfad}`, {
				method: methode,
				headers: { "Content-Type": "application/json", "X-Pin": speicher.get("pw-pin") },
				body: body ? JSON.stringify(body) : undefined
			});
			if (res.status === 403 && nochmal) {
				const pin = prompt("PIN der Pinnwand:");
				if (pin === null) throw new Error("Abgebrochen");
				speicher.set("pw-pin", pin.trim());
				return api(methode, pfad, body, false);
			}
			const json = await res.json();
			if (!res.ok) throw new Error(json.fehler || "Fehler");
			return json;
		}

		function zeichnen () {
			const offen = daten.todos.filter((t) => !t.erledigt);
			const erledigt = daten.todos.filter((t) => t.erledigt).sort((a, b) => b.erledigt - a.erledigt);
			liste("offen", offen, "Alles erledigt.");
			liste("erledigt", erledigt, "Noch nichts erledigt.");

			const box = document.getElementById("aktuell");
			const n = daten.nachricht;
			box.hidden = !n;
			box.innerHTML = "";
			if (n) {
				const bis = new Date(n.bis).toLocaleString("de-CH", { weekday: "short", hour: "2-digit", minute: "2-digit" });
				box.innerHTML = '<div class="aktuell"><div class="text"></div><div class="info"></div><div class="reihe"><button class="leise">Entfernen</button></div></div>';
				box.querySelector(".text").textContent = n.text;
				box.querySelector(".info").textContent = `${n.von || "Jemand"} · sichtbar bis ${bis}`;
				box.querySelector("button").onclick = () => aktion(() => api("DELETE", "/nachricht"));
			}
		}

		function liste (id, eintraege, leertext) {
			const ul = document.getElementById(id);
			ul.innerHTML = "";
			if (!eintraege.length) {
				ul.innerHTML = `<li class="leer">${leertext}</li>`;
				return;
			}
			for (const t of eintraege) {
				const li = document.createElement("li");
				if (t.erledigt) li.className = "erledigt";
				li.innerHTML = '<button class="haken" aria-label="abhaken"></button><div class="text"><div></div><div class="von"></div></div><button class="weg" aria-label="löschen">×</button>';
				li.querySelector(".text div").textContent = t.text;
				li.querySelector(".von").textContent = t.von || "";
				li.querySelector(".haken").onclick = () => aktion(() => api("POST", `/todos/${t.id}`, { erledigt: !t.erledigt }));
				li.querySelector(".weg").onclick = () => {
					if (confirm(`«${t.text}» löschen?`)) aktion(() => api("DELETE", `/todos/${t.id}`));
				};
				ul.appendChild(li);
			}
		}

		async function aktion (fn) {
			try {
				daten = { ...daten, ...(await fn()) };
				zeichnen();
			} catch (error) {
				if (error.message !== "Abgebrochen") meldung(error.message);
			}
		}

		async function laden () {
			try {
				daten = await api("GET", "");
				zeichnen();
			} catch {
				meldung("Spiegel nicht erreichbar");
			}
		}

		document.getElementById("todoForm").onsubmit = (e) => {
			e.preventDefault();
			const feld = document.getElementById("todoText");
			const text = feld.value.trim();
			if (!text) return;
			aktion(async () => {
				const res = await api("POST", "/todos", { text, von: name() });
				feld.value = "";
				return res;
			});
		};

		document.getElementById("nachrichtForm").onsubmit = (e) => {
			e.preventDefault();
			const feld = document.getElementById("nachrichtText");
			const text = feld.value.trim();
			if (!text) return;
			let stunden = document.getElementById("dauer").value;
			if (stunden === "heute") {
				const abend = new Date();
				abend.setHours(22, 0, 0, 0);
				stunden = Math.max((abend - Date.now()) / 3600e3, 1);
			}
			aktion(async () => {
				const res = await api("POST", "/nachricht", { text, von: name(), stunden: Number(stunden) });
				feld.value = "";
				return res;
			});
		};

		document.getElementById("nameAendern").onclick = (e) => {
			e.preventDefault();
			speicher.set("pw-name", "");
			name();
		};
		document.getElementById("pinVergessen").onclick = (e) => {
			e.preventDefault();
			speicher.set("pw-pin", "");
			meldung("PIN wird beim nächsten Speichern abgefragt");
		};

		document.getElementById("name").textContent = speicher.get("pw-name") || "–";
		laden();
		setInterval(laden, 15000);
		document.addEventListener("visibilitychange", () => { if (!document.hidden) laden(); });
	</script>
</body>
</html>
